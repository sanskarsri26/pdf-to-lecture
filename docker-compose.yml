services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /app/data/app.db
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - app-data:/app/data

  web:
    build:
      context: frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  app-data:
